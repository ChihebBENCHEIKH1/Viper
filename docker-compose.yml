version: '3.8'

services:
  viper-temporal:
    container_name: viper-temporal
    image: temporalio/temporal:latest
    # Dev server (sqlite-backed) — auto-setup image does not support DB=sqlite. Matches Shannon.
    command: ['server', 'start-dev', '--db-filename', '/home/temporal/temporal.db', '--ip', '0.0.0.0']
    ports:
      - '7234:7233'   # host 7234 -> container 7233 (avoid clash with Shannon's Temporal)
      - '8234:8233'   # host 8234 -> container 8233 (Temporal Web UI)
    volumes:
      - viper-temporal-data:/home/temporal
    networks:
      - viper-net
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', 'localhost:7233']
      interval: 10s
      timeout: 5s
      retries: 10

  viper-emulator:
    container_name: viper-emulator
    image: budtmo/docker-android:emulator_14.0
    privileged: true
    ports:
      - '5555:5555'   # ADB
      - '6080:6080'   # noVNC
      - '27042:27042' # Frida server
      - '8080:8080'   # mitmproxy web UI
    environment:
      - EMULATOR_DEVICE=pixel_7
      - WEB_VNC=true
    devices:
      - /dev/kvm
    networks:
      - viper-net
    profiles:
      - emulator

networks:
  viper-net:
    name: viper-net

volumes:
  viper-temporal-data:
